<div class="chat-shell glass-card">

  <!-- Contacts sidebar -->
  <div class="contacts-panel">
    <div class="contacts-header">
      <p class="contacts-title">Staff Chat</p>
      <span *ngIf="totalUnread > 0" class="unread-badge">{{ totalUnread }}</span>
    </div>
    <div class="contacts-list">
      <button *ngFor="let c of contacts" class="contact-item" [class.active]="activeContact?.id === c.id" (click)="selectContact(c)">
        <div class="contact-avatar" [class.online]="c.online">{{ initials(c.name) }}</div>
        <div class="contact-body">
          <div class="contact-top">
            <span class="contact-name">{{ c.name }}</span>
            <span *ngIf="c.unread > 0" class="contact-badge">{{ c.unread }}</span>
          </div>
          <p class="contact-role">{{ c.role }} · {{ c.branch }}</p>
          <p class="contact-last">{{ c.lastMessage }}</p>
        </div>
      </button>
    </div>
  </div>

  <!-- Messages panel -->
  <div class="messages-panel">
    <ng-container *ngIf="activeContact; else noChat">
      <div class="msg-header">
        <div class="contact-avatar sm" [class.online]="activeContact.online">{{ initials(activeContact.name) }}</div>
        <div>
          <p class="msg-contact-name">{{ activeContact.name }}</p>
          <p class="msg-contact-role">{{ activeContact.role }} · {{ activeContact.online ? 'Online' : 'Offline' }}</p>
        </div>
      </div>
      <div class="msg-list">
        <div *ngFor="let m of messages" class="msg-bubble" [class.from-me]="m.fromMe" [class.from-them]="!m.fromMe">
          <p class="msg-text">{{ m.text }}</p>
          <span class="msg-time">{{ m.time }}</span>
        </div>
      </div>
      <div class="msg-input-row">
        <input type="text" class="msg-input" placeholder="Type a message..." [(ngModel)]="newMessage" (keyup.enter)="sendMessage()" />
        <button class="send-btn" (click)="sendMessage()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </ng-container>
    <ng-template #noChat>
      <div class="no-chat">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.3"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        <p>Select a staff member to start chatting</p>
      </div>
    </ng-template>
  </div>

</div>
