<div class="notif-layout">
  <div class="glass-card notif-card">
    <div class="notif-header">
      <h3 class="card-title">🔔 Notifications</h3>
      <div class="notif-actions">
        <span class="unread-count" *ngIf="unreadCount > 0">{{ unreadCount }} unread</span>
        <button class="mark-all-btn" (click)="markAllRead()" *ngIf="unreadCount > 0">Mark all read</button>
      </div>
    </div>

    <div *ngIf="loading" class="skeleton-list">
      <div class="skeleton" style="height:72px;border-radius:12px" *ngFor="let i of [1,2,3]"></div>
    </div>

    <div class="notif-list" [@listAnim]="notifications.length" *ngIf="!loading">
      <div *ngFor="let n of notifications"
           class="notif-row"
           [class.unread]="!n.read"
           [style.border-left-color]="typeColor(n.type)"
           (click)="markRead(n.id)">
        <div class="notif-icon-wrap" [style.background]="typeColor(n.type) + '22'">
          <span class="notif-icon">{{ typeIcon(n.type) }}</span>
        </div>
        <div class="notif-body">
          <div class="notif-title-row">
            <p class="notif-title">{{ n.title }}</p>
            <span class="notif-unread-dot" *ngIf="!n.read"></span>
          </div>
          <p class="notif-msg">{{ n.message }}</p>
          <p class="notif-time">{{ n.time }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
