<div class="notif-wrap">
  <div class="notif-header">
    <div>
      <h2 class="section-title">Notification Center</h2>
      <p class="section-sub">System alerts, maintenance notices, and stock warnings</p>
    </div>
    <button *ngIf="unreadCount > 0" class="btn-mark-all" (click)="markAllRead()">Mark all read</button>
  </div>

  <div class="notif-list">
    <div *ngFor="let n of notifications" class="notif-item" [class.unread]="!n.read" [class]="severityClass(n.severity)" (click)="markRead(n)">
      <div class="notif-icon" [innerHTML]="typeIcon(n.type)"></div>
      <div class="notif-body">
        <p class="notif-title">{{ n.title }}</p>
        <p class="notif-msg">{{ n.message }}</p>
        <p class="notif-time">{{ n.time }}</p>
      </div>
      <div class="notif-dot" *ngIf="!n.read"></div>
    </div>
    <div *ngIf="notifications.length === 0" class="notif-empty">No notifications</div>
  </div>
</div>
