<div class="shelf3d-wrap">
  <div class="shelf3d-header">
    <h2 class="section-title">3D Inventory Visualization</h2>
    <p class="section-sub">Bottle color: green = adequate &bull; amber = low &bull; red = critical/out of stock</p>
  </div>
  <div class="canvas-container">
    <canvas #shelfCanvas class="shelf-canvas"></canvas>
  </div>
  <div class="legend-row">
    <span class="legend-item ok"><span class="dot"></span>Adequate</span>
    <span class="legend-item low"><span class="dot"></span>Low Stock</span>
    <span class="legend-item critical"><span class="dot"></span>Critical / Out</span>
  </div>
</div>
