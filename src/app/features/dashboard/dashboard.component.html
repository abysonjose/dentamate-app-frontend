<div class="dm-shell" [class.dark]="theme === 'dark'" [class.light]="theme === 'light'">

  <!-- ── Mobile overlay ── -->
  <div *ngIf="mobileMenuOpen"
       class="fixed inset-0 z-30 bg-black/60 backdrop-blur-sm lg:hidden"
       (click)="mobileMenuOpen = false"></div>

  <!-- ══════════════════════════════════════════════════════════════════════
       SIDEBAR
  ══════════════════════════════════════════════════════════════════════ -->
  <aside class="dm-sidebar"
         [class.open]="sidebarOpen || mobileMenuOpen"
         [@sidebarSlide]>

    <!-- Logo -->
    <div class="sidebar-logo">
      <div class="logo-icon">
        <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="20" fill="url(#sg)"/>
          <path d="M13 14c0-3.866 3.134-7 7-7s7 3.134 7 7c0 2.5-1.3 4.7-3.25 6L20 28l-3.75-8C14.3 18.7 13 16.5 13 14z"
                fill="white" opacity="0.9"/>
          <defs>
            <linearGradient id="sg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
              <stop stop-color="#0d9488"/><stop offset="1" stop-color="#1d4ed8"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <span class="logo-text">DentaMate</span>
    </div>

    <!-- Patient card -->
    <div class="patient-card">
      <div class="patient-avatar">
        <img *ngIf="profileService.avatar$ | async as av" [src]="av" alt="Patient photo" class="patient-avatar-img" />
        <span *ngIf="!(profileService.avatar$ | async)">{{ profileService.initials$ | async }}</span>
      </div>
      <div class="patient-info">
        <p class="patient-name">{{ profileService.name$ | async }}</p>
        <p class="patient-id">ID: DM-20483</p>
      </div>
    </div>

    <!-- Nav -->
    <nav class="sidebar-nav" role="navigation" aria-label="Dashboard navigation">
      <button *ngFor="let item of navItems"
              class="nav-item"
              [class.active]="activeSection === item.id"
              (click)="navigate(item.id)"
              [attr.aria-current]="activeSection === item.id ? 'page' : null">
        <span class="nav-icon" [innerHTML]="getIcon(item.icon)"></span>
        <span class="nav-label">{{ item.label }}</span>
        <span *ngIf="item.badge" class="nav-badge">{{ item.badge }}</span>
      </button>
    </nav>

    <!-- Sidebar footer -->
    <div class="sidebar-footer">
      <button class="nav-item text-red-400 hover:text-red-300" aria-label="Sign out">
        <span class="nav-icon" [innerHTML]="getIcon('log-out')"></span>
        <span class="nav-label">Sign Out</span>
      </button>
    </div>
  </aside>

  <!-- ══════════════════════════════════════════════════════════════════════
       MAIN AREA
  ══════════════════════════════════════════════════════════════════════ -->
  <div class="dm-main">

    <!-- Top header -->
    <header class="dm-header">
      <button class="menu-btn lg:hidden" (click)="mobileMenuOpen = !mobileMenuOpen" aria-label="Toggle menu">
        <span [innerHTML]="getIcon('menu')"></span>
      </button>
      <div class="header-title">
        <h1>{{ getSectionTitle() }}</h1>
        <p class="header-date">{{ today }}</p>
      </div>
      <div class="header-actions">
        <!-- Theme toggle -->
        <button class="icon-btn" (click)="themeService.toggle()"
                [attr.aria-label]="'Switch to ' + (theme === 'dark' ? 'light' : 'dark') + ' mode'"
                [title]="'Switch to ' + (theme === 'dark' ? 'light' : 'dark') + ' mode'">
          <svg *ngIf="theme === 'dark'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg *ngIf="theme === 'light'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
          </svg>
        </button>
        <button class="icon-btn relative" aria-label="Notifications" title="Notifications" (click)="soundService.playNotification(); navigate('activity')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 01-3.46 0"/>
          </svg>
          <span class="absolute top-1 right-1 w-2 h-2 bg-teal-400 rounded-full"></span>
        </button>
        <div class="header-avatar-wrap">
          <button class="header-avatar" (click)="toggleProfileMenu()" aria-label="User profile menu"
                  [attr.aria-expanded]="profileMenuOpen">
            <img *ngIf="profileService.avatar$ | async as av" [src]="av" alt="Profile" class="header-avatar-img" />
            <span *ngIf="!(profileService.avatar$ | async)">{{ profileService.initials$ | async }}</span>
          </button>
          <!-- Dropdown -->
          <div *ngIf="profileMenuOpen" class="profile-dropdown" role="menu">
            <div class="profile-dropdown-header">
              <div class="pd-avatar">
                <img *ngIf="profileService.avatar$ | async as av" [src]="av" alt="Profile" class="header-avatar-img" />
                <span *ngIf="!(profileService.avatar$ | async)">{{ profileService.initials$ | async }}</span>
              </div>
              <div>
                <p class="pd-name">{{ profileService.name$ | async }}</p>
                <p class="pd-id">DM-20483</p>
              </div>
            </div>
            <div class="profile-dropdown-divider"></div>
            <button class="pd-item" role="menuitem" (click)="navigate('profile')">
              <span [innerHTML]="getIcon('user')"></span> My Profile
            </button>
            <button class="pd-item pd-signout" role="menuitem">
              <span [innerHTML]="getIcon('log-out')"></span> Sign Out
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Content -->
    <main class="dm-content" [@contentFade]="activeSection">
      <ng-container [ngSwitch]="activeSection">

        <!-- OVERVIEW -->
        <div *ngSwitchCase="'overview'" class="section-grid page-enter" [@staggerCards]="'in'">
          <app-tooth-viewer class="col-span-full lg:col-span-2"></app-tooth-viewer>
          <app-appointments class="col-span-full lg:col-span-1"></app-appointments>
          <app-financials class="col-span-full lg:col-span-1"></app-financials>
          <app-activity-feed class="col-span-full lg:col-span-2"></app-activity-feed>
        </div>

        <!-- APPOINTMENTS -->
        <div *ngSwitchCase="'appointments'" class="page-enter">
          <app-appointments [fullView]="true"></app-appointments>
        </div>

        <!-- RECORDS -->
        <div *ngSwitchCase="'records'" class="page-enter">
          <app-medical-records></app-medical-records>
        </div>

        <!-- FINANCIALS -->
        <div *ngSwitchCase="'financials'" class="page-enter">
          <app-financials [fullView]="true"></app-financials>
        </div>

        <!-- ACTIVITY -->
        <div *ngSwitchCase="'activity'" class="page-enter">
          <app-activity-feed [fullView]="true"></app-activity-feed>
        </div>

        <!-- FEEDBACK -->
        <div *ngSwitchCase="'feedback'" class="page-enter">
          <app-feedback></app-feedback>
        </div>

        <!-- SETTINGS -->
        <div *ngSwitchCase="'settings'" class="page-enter">
          <app-settings></app-settings>
        </div>

        <!-- PROFILE -->
        <div *ngSwitchCase="'profile'" class="page-enter">
          <app-patient-profile></app-patient-profile>
        </div>

      </ng-container>
    </main>
  </div>

  <!-- ── AI Chat FAB ── -->
  <app-ai-chat></app-ai-chat>

</div>
