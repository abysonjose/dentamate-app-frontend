<!-- FAB -->
<button class="chat-fab" (click)="toggle()" [class.open]="isOpen"
        aria-label="Open AI symptom analyser">
  <span class="fab-icon" *ngIf="!isOpen">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
    </svg>
  </span>
  <span class="fab-icon" *ngIf="isOpen">✕</span>
  <span class="fab-pulse" *ngIf="!isOpen"></span>
</button>

<!-- Chat panel -->
<div class="chat-panel" *ngIf="isOpen" [@chatAnim] role="dialog" aria-label="AI Symptom Analyser">
  <!-- Header -->
  <div class="chat-header">
    <div class="ai-avatar">🤖</div>
    <div>
      <p class="ai-name">DentaAI Assistant</p>
      <p class="ai-status">
        <span class="status-dot"></span>
        {{ isTyping ? 'Analysing...' : 'Online' }}
      </p>
    </div>
    <button class="close-chat" (click)="toggle()" aria-label="Close chat">✕</button>
  </div>

  <!-- Messages -->
  <div class="chat-messages" #msgContainer>
    <div *ngFor="let msg of messages" class="msg-wrap" [class.user]="msg.role === 'user'" [@msgAnim]>
      <div class="msg-bubble" [class.user-bubble]="msg.role === 'user'" [class.ai-bubble]="msg.role === 'ai'">
        <p [innerHTML]="msg.text | boldMarkdown"></p>
        <span class="msg-time">{{ msg.time }}</span>
      </div>
    </div>

    <!-- Typing indicator -->
    <div class="msg-wrap" *ngIf="isTyping" [@msgAnim]>
      <div class="ai-bubble typing-indicator">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="chat-input-area">
    <input
      type="text"
      [formControl]="inputCtrl"
      placeholder="Describe your symptoms..."
      (keydown)="onKeydown($event)"
      aria-label="Type your symptoms"
    />
    <button class="send-btn" (click)="send()" [disabled]="inputCtrl.invalid" aria-label="Send message">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>
